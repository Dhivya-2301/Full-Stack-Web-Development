<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #bfdbfe, #93c5fd);
      margin: 0;
    }

    /* Navbar */
    .navbar {
      background: #2563eb !important;
      padding: 12px 20px;
    }

    .navbar-brand {
      font-size: 20px;
      font-weight: 600;
      color: white !important;
    }

    /* Center Layout */
    .main-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 85vh;
    }

    /* Card */
    .dashboard-card {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .dashboard-card h2 {
      margin-bottom: 10px;
      color: #1e3a8a;
    }

    .dashboard-card p {
      color: #555;
      margin-bottom: 20px;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-custom {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 500;
      cursor: pointer;
    }

    .show-btn {
      background: #10b981;
      color: white;
    }

    .show-btn:hover {
      background: #059669;
    }

    .hide-btn {
      background: #ef4444;
      color: white;
    }

    .hide-btn:hover {
      background: #dc2626;
    }

    /* User Data Box */
    #userData {
      display: none;
      margin-top: 20px;
      background: #f1f5f9;
      padding: 15px;
      border-radius: 10px;
      text-align: left;
    }

    /* Logout */
    .logout-btn {
      background: white;
      color: #2563eb;
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
    }

    .logout-btn:hover {
      background: #e0e7ff;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand">My Dashboard</span>
      <a href="login.html" class="logout-btn">Logout</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-wrapper">
    <div class="dashboard-card">

      <h2>Welcome to Dashboard</h2>
      <p id="welcomeText">Hello, User!</p>

      <div class="btn-group">
        <button class="btn-custom show-btn" onclick="showData()">Show Data</button>
        <button class="btn-custom hide-btn" onclick="hideData()">Hide Data</button>
      </div>

      <div id="userData">
        <p><strong>Name:</strong> <span id="displayName"></span></p>
        <p><strong>Email:</strong> <span id="displayEmail"></span></p>
      </div>

    </div>
  </div>

  <!-- Script -->
  <script>
    const userName = localStorage.getItem("userName") || "User";
    const userEmail = localStorage.getItem("userEmail") || "user@email.com";

    document.getElementById("welcomeText").textContent = "Hello, " + userName + "!";
    document.getElementById("displayName").textContent = userName;
    document.getElementById("displayEmail").textContent = userEmail;

    function showData() {
      document.getElementById("userData").style.display = "block";
    }

    function hideData() {
      document.getElementById("userData").style.display = "none";
    }
  </script>

</body>
</html>
